<style>

<body>

<div id="splash"><div style="font-size:56px">🎮</div><h1 style="font-size:38px;font-weight:900;margin-top:8px">EarnKart PLAY</h1><p style="letter-spacing:4px;margin-top:8px;font-weight:800">PLAY YOUR WORLD ✨</p></div>

<script>

var db=null;try{firebase.initializeApp(firebaseConfig);db=firebase.database();}catch(e){}

// 6 GAMES - EMBEDDED INSIDE - NO FOLDER NEEDED!
var EMBEDDED_GAMES={
bubble:`<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{margin:0;padding:0}body{height:100vh;background:linear-gradient(#87e5ff,#2a9fd6);overflow:hidden;font-family:system-ui}#score{position:fixed;top:0;left:0;right:0;background:linear-gradient(90deg,#ff6b9d,#7c4dff);color:#fff;padding:8px 12px;display:flex;justify-content:space-between;font-weight:900;z-index:10}#field{position:relative;width:100%;height:100%}.bubble{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,rgba(100,200,255,.6));border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;animation:float 5s linear forwards}@keyframes float{to{transform:translateY(-110vh)}}</style></head><body><div id="score"><span>🫧 Bubble Pop</span><span id="sc">0</span></div><div id="field"></div><script>let s=0;function spawn(){let b=document.createElement('div');b.className='bubble';let sz=50+Math.random()*40;b.style.width=sz+'px';b.style.height=sz+'px';b.style.left=Math.random()*85+'%';b.style.bottom='-60px';b.textContent=['⭐','💙','🫧'][Math.floor(Math.random()*3)];b.onclick=()=>{s+=10;document.getElementById('sc').innerText=s;parent.postMessage({type:'EARNKART_GAME_SCORE',score:10,game:'Ocean Bubble'},'*');b.remove()};document.getElementById('field').appendChild(b);setTimeout(()=>b.remove(),5000)}setInterval(spawn,650);<\/script></body></html>`,

restaurant:`<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{margin:0;padding:0}body{height:100vh;background:#1a0f2e;display:flex;flex-direction:column;font-family:system-ui}.hud{background:linear-gradient(90deg,#ff6b9d,#7c4dff);color:#fff;padding:8px 12px;display:flex;justify-content:space-between;font-weight:900}.scene{flex:1;position:relative;background:linear-gradient(#2d1b4e,#1a0f2e);display:flex;align-items:center;justify-content:center}.chef{font-size:64px;animation:bounce 2s infinite}@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}.tray{position:absolute;bottom:0;left:0;right:0;background:#2a1a45;padding:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.food{background:#3d2a5e;border-radius:10px;padding:10px;text-align:center;cursor:pointer;border:2px solid #4a2c6e}.food:active{background:#ff6b9d}</style></head><body><div class="hud"><span>🍔 Restaurant Tycoon</span><span id="coins">0 Coins</span></div><div class="scene"><div class="chef">👨‍🍳</div><div style="position:absolute;top:30%;color:#ffd700;font-weight:900;letter-spacing:2px">★ EARNKART RESTAURANT ★</div><div style="position:absolute;top:45%;background:#fff;padding:8px 16px;border-radius:20px;border:2px solid #ff6b9d"><span style="font-size:22px">🍔</span> <b style="font-size:10px;color:#4a148c">BURGER</b></div><div class="tray"><div class="food" onclick="serve()">🍔<br><small>Burger</small></div><div class="food" onclick="serve()">🍕<br><small>Pizza</small></div><div class="food" onclick="serve()">🍟<br><small>Fries</small></div><div class="food" onclick="serve()">🌮<br><small>Taco</small></div></div></div><script>let c=0;function serve(){c+=10;document.getElementById('coins').innerText=c+' Coins';parent.postMessage({type:'EARNKART_GAME_SCORE',score:10,game:'Restaurant Tycoon'},'*');}<\/script></body></html>`,

bus:`<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{margin:0;padding:0}body{height:100vh;background:#B8E6F5;display:flex;flex-direction:column;font-family:system-ui}.hud{background:#ff6b9d;color:#fff;padding:10px;text-align:center;font-weight:900}.yard{flex:1;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;padding:20px}.bus{width:80px;height:50px;background:linear-gradient(135deg,#ffd700,#ffb300);border-radius:10px 10px 5px 5px;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;border:3px solid #333;transition:.2s}.bus:active{transform:scale(0.9)}</style></head><body><div class="hud">🚌 Bus Jam - Tap buses to park!</div><div class="yard" id="yard"></div><script>const colors=['🚌','🚐','🚎'];const yard=document.getElementById('yard');for(let i=0;i<8;i++){let b=document.createElement('div');b.className='bus';b.textContent=colors[Math.floor(Math.random()*3)];b.onclick=()=>{b.style.transform='translateX(200px)';setTimeout(()=>b.remove(),300);parent.postMessage({type:'EARNKART_GAME_SCORE',score:15,game:'Bus Jam'},'*')};yard.appendChild(b);}<\/script></body></html>`,

ball:`<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{margin:0;padding:0}body{height:100vh;background:#E1F5FE;display:flex;flex-direction:column;font-family:system-ui}.hud{background:#7c4dff;color:#fff;padding:10px;text-align:center;font-weight:900}.tubes{display:flex;justify-content:center;gap:10px;padding:20px;flex-wrap:wrap}.tube{width:60px;height:180px;background:rgba(255,255,255,.6);border:3px solid #7c4dff;border-radius:0 0 20px 20px;display:flex;flex-direction:column-reverse;padding:5px;gap:3px}.ball{width:100%;height:30px;border-radius:50%;cursor:pointer}</style></head><body><div class="hud">⚽ Ball Sort - Tap to sort colors</div><div class="tubes" id="tubes"></div><script>const colors=['#ff6b9d','#7c4dff','#4fc3f7','#66bb6a'];const tubes=document.getElementById('tubes');for(let i=0;i<4;i++){let t=document.createElement('div');t.className='tube';for(let j=0;j<4;j++){let b=document.createElement('div');b.className='ball';b.style.background=colors[Math.floor(Math.random()*4)];b.onclick=()=>{parent.postMessage({type:'EARNKART_GAME_SCORE',score:5,game:'Ball Sort'},'*');b.style.transform='scale(0)';setTimeout(()=>b.remove(),200)};t.appendChild(b);}tubes.appendChild(t);}<\/script></body></html>`,

words:`<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{margin:0;padding:0}body{height:100vh;background:linear-gradient(135deg,#87CEEB,#4fc3f7);display:flex;align-items:center;justify-content:center;font-family:system-ui}.card{background:#fff;border-radius:20px;padding:20px;width:90%;max-width:320px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2)}.letters{display:flex;justify-content:center;gap:8px;margin:15px 0}.letter{width:45px;height:45px;background:linear-gradient(135deg,#ff6b9d,#7c4dff);color:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;cursor:pointer}.letter:active{transform:scale(0.9)}</style></head><body><div class="card"><h2>🔤 Word Connect</h2><p style="font-size:12px;color:#666;margin:8px 0">Tap letters to form word: CAT</p><div class="letters" id="letters"></div><div id="word" style="font-weight:900;letter-spacing:3px;min-height:24px"></div><button onclick="check()" style="margin-top:12px;padding:8px 18px;background:linear-gradient(135deg,#ff6b9d,#7c4dff);border:none;color:#fff;border-radius:8px;font-weight:800">CHECK</button></div><script>let w='';const letters=['C','A','T','S','O','N'];const cont=document.getElementById('letters');letters.forEach(l=>{let d=document.createElement('div');d.className='letter';d.textContent=l;d.onclick=()=>{w+=l;document.getElementById('word').innerText=w};cont.appendChild(d);});function check(){if(w==='CAT'){alert('Correct! +20 coins');parent.postMessage({type:'EARNKART_GAME_SCORE',score:20,game:'Word Connect'},'*');w='';document.getElementById('word').innerText='';}else{alert('Try again');w='';document.getElementById('word').innerText='';}}<\/script></body></html>`,

panda:`<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{margin:0;padding:0}body{height:100vh;background:linear-gradient(135deg,#a1c4fd,#c2e9fb);display:flex;align-items:center;justify-content:center;font-family:system-ui}.card{background:#fff;border-radius:20px;padding:20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2)}.grid{display:grid;grid-template-columns:repeat(3,60px);gap:8px;margin:15px 0}.cell{width:60px;height:60px;background:#e0e7ff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer}.cell:active{transform:scale(0.9)}</style></head><body><div class="card"><h2>🐼 Panda Puzzle</h2><p style="font-size:11px;color:#666">Find pandas!</p><div class="grid" id="grid"></div><div id="msg">Score: <span id="sc">0</span></div></div><script>let s=0;const icons=['🐼','🐻','🐨','🐼','🦊','🐼','🐻','🐼','🐨'];const grid=document.getElementById('grid');icons.forEach(ic=>{let d=document.createElement('div');d.className='cell';d.textContent='❓';d.onclick=()=>{d.textContent=ic;if(ic==='🐼'){s+=10;document.getElementById('sc').innerText=s;parent.postMessage({type:'EARNKART_GAME_SCORE',score:10,game:'Panda Puzzle'},'*');}};grid.appendChild(d);});<\/script></body></html>`
};

var games=[
{id:'bubble',name:'Ocean Bubble',icon:'🫧',url:'bubble'},
{id:'restaurant',name:'Restaurant Tycoon',icon:'🍔',url:'restaurant'},
{id:'bus',name:'Bus Jam',icon:'🚌',url:'bus'},
{id:'ball',name:'Ball Sort',icon:'⚽',url:'ball'},
{id:'words',name:'Word Connect',icon:'🔤',url:'words'},
{id:'panda',name:'Panda Puzzle',icon:'🐼',url:'panda'}
];

var user=localStorage.getItem('earnkart_username')||'Player';
var totalScore=parseInt(localStorage.getItem('earnkart_total_score'))||0;
var totalPlayed=parseInt(localStorage.getItem('earnkart_total_played'))||0;
var totalCoins=parseInt(localStorage.getItem('earnkart_coins'))||0;
var gameScores={};try{gameScores=JSON.parse(localStorage.getItem('earnkart_game_scores'))||{}}catch(e){}

function init(){
document.getElementById('userName').innerText=user;
document.getElementById('statScore').innerText=totalScore;
document.getElementById('statPlayed').innerText=totalPlayed;
document.getElementById('statCoins').innerText=totalCoins;
render();
loadAds();
}

function render(){
var g=document.getElementById('gamesGrid');
g.innerHTML=games.map(x=>`<div class="game-card" onclick="openGame('${x.id}')"><div class="badge-new">NEW</div><div class="game-thumb">${x.icon}</div><div style="font-weight:800;font-size:12px;text-align:center">${x.name}</div><div style="display:flex;justify-content:space-between;margin-top:6px;font-size:10px"><span style="color:#999">0 plays</span><span style="background:linear-gradient(135deg,#ff6b9d,#7c4dff);color:#fff;padding:2px 8px;border-radius:10px;font-weight:800">${gameScores[x.id]||0} pts</span></div></div>`).join('');
}

function openGame(id){
var game=games.find(x=>x.id===id);
document.getElementById('gameTitle').innerText=game.name;
document.getElementById('gFrame').srcdoc=EMBEDDED_GAMES[id];
document.getElementById('gameView').style.display='flex';
totalPlayed++;localStorage.setItem('earnkart_total_played',totalPlayed);
document.getElementById('statPlayed').innerText=totalPlayed;
render();
}

function closeGame(){document.getElementById('gFrame').srcdoc='';document.getElementById('gameView').style.display='none';}

function loadAds(){
// FIXED AD METHOD - Works on Netlify (not iframe-in-iframe)
var key='5c7c31add62fa96e382309b28478f957';
function inject(id){
var w=document.getElementById(id);
if(!w) return;
w.innerHTML='<div id="ad-'+id+'"></div>';
var s1=document.createElement('script');
s1.text="atOptions={'key':'"+key+"','format':'iframe','height':50,'width':320,'params':{}};";
var s2=document.createElement('script');
s2.src='https://www.highperformanceformat.com/'+key+'/invoke.js';
w.appendChild(s1);w.appendChild(s2);
}
inject('adTop');inject('adBottom');
}

function openSettings(){document.getElementById('nameInput').value=user;document.getElementById('settingsModal').classList.add('show');}
function saveSettings(){var n=document.getElementById('nameInput').value.trim();if(n){user=n;localStorage.setItem('earnkart_username',n);document.getElementById('userName').innerText=n;showToast('✅ Saved!')}closeModal('settingsModal');}
function closeModal(id){document.getElementById(id).classList.remove('show');}
function openLeaderboard(){document.getElementById('leaderboardModal').classList.add('show');}
function showToast(m){var t=document.getElementById('toast');t.innerText=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

window.addEventListener('message',function(e){
if(e.data && e.data.type==='EARNKART_GAME_SCORE'){
var s=parseInt(e.data.score)||0;
if(e.data.game){
var gid=games.find(g=>g.name===e.data.game)?.id;
if(gid) gameScores[gid]=(gameScores[gid]||0)+s;
}
totalScore+=s;totalCoins+=s;
localStorage.setItem('earnkart_total_score',totalScore);
localStorage.setItem('earnkart_coins',totalCoins);
localStorage.setItem('earnkart_game_scores',JSON.stringify(gameScores));
document.getElementById('statScore').innerText=totalScore;
document.getElementById('statCoins').innerText=totalCoins;
render();showToast('💰 +'+s+' coins!');
}
});

setTimeout(function(){
document.getElementById('splash').style.display='none';
document.getElementById('app').style.display='flex';
init();
},2000);
</script>
</body>
</html>
